name: Random Picture
on:
  schedule:
    - cron: "30 2 * * *"   # 每天 UTC 2:30（北京时间 10:30）换图
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick random pictures
        run: |
          base="https://app.hnyqwq.cn/png/hnyqwq"
          # 横屏池：随机一张存为 randomHorizontal.jpg（放在贡献图上方）
          horizontal=("$base/showHorizontal.jpg" "$base/show3.jpg" "$base/showlogin-bg.jpg")
          # 竖屏池：随机一张存为 random.jpg（放在左半边）；想加图就在这里追加文件名
          vertical=("$base/showVertical.jpg")
          curl -fsSL -o randomHorizontal.jpg "${horizontal[$((RANDOM % ${#horizontal[@]}))]}"
          curl -fsSL -o random.jpg "${vertical[$((RANDOM % ${#vertical[@]}))]}"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add random.jpg randomHorizontal.jpg
          git diff --cached --quiet || git commit -m "chore: rotate random pictures"
          git push
