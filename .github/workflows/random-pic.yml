name: Random Picture
on:
  schedule:
    - cron: "30 2 * * *"   # 每天 UTC 2:30（北京时间 10:30）换一张
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick a random picture
        run: |
          i=$((RANDOM % 4 + 1))
          curl -fsSL -o random.jpg "https://app.hnyqwq.cn/png/hnyqwq/show${i}.jpg"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add random.jpg
          git diff --cached --quiet || git commit -m "chore: rotate random picture"
          git push
