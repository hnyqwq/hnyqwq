name: Keep Warm
on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟 ping 一次，防止云函数冷启动超时
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping both random URLs
        run: |
          curl -s -o /dev/null -w "h: %{http_code}\n" "https://1234567hnyznb.rx.hnyqwq.cn/?type=h"
          curl -s -o /dev/null -w "v: %{http_code}\n" "https://1234567hnyznb.rx.hnyqwq.cn/?type=v"
